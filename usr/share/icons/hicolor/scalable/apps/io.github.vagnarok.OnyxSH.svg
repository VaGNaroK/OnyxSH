<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Drop Shadow Filters -->
    <filter id="squircle-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    
    <filter id="gem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Base Squircle Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242636"/>
      <stop offset="40%" stop-color="#171822"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>

    <linearGradient id="bg-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555874" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#2a2c3d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14141d" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="inner-void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12131c"/>
      <stop offset="75%" stop-color="#090a0e"/>
      <stop offset="100%" stop-color="#040407"/>
    </radialGradient>

    <!-- Neon Prompt Gradients -->
    <linearGradient id="prompt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="prompt-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <g filter="url(#squircle-shadow)">
    <rect x="10" y="10" width="108" height="108" rx="26" ry="26" fill="url(#bg-grad)"/>
    <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" ry="25.5" fill="none" stroke="url(#bg-border)" stroke-width="1.2"/>
  </g>

  <!-- 12-sided Faceted Onyx Gem Ring with Crisp 100% Pure White Facet Lines -->
  <g filter="url(#gem-shadow)">
    <!-- Outer Facets -->
    <polygon points="53,23 75,23 73,31 55,31" fill="#464964"/>
    <polygon points="75,23 93,33 87,40 73,31" fill="#36384d"/>
    <polygon points="93,33 105,51 97,55 87,40" fill="#232433"/>
    <polygon points="105,51 105,77 97,73 97,55" fill="#181923"/>
    <polygon points="105,77 93,95 87,88 97,73" fill="#14151e"/>
    <polygon points="93,95 75,105 73,97 87,88" fill="#232433"/>
    <polygon points="75,105 53,105 55,97 73,97" fill="#181923"/>
    <polygon points="53,105 35,95 41,88 55,97" fill="#232433"/>
    <polygon points="35,95 23,77 31,73 41,88" fill="#3d4057"/>
    <polygon points="23,77 23,51 31,55 31,73" fill="#36384d"/>
    <polygon points="23,51 35,33 41,40 31,55" fill="#464964"/>
    <polygon points="35,33 53,23 55,31 41,40" fill="#464964"/>

    <!-- Inner Facets Layer -->
    <polygon points="55,31 73,31 71,40 57,40" fill="#3d4057"/>
    <polygon points="73,31 87,40 82,48 71,40" fill="#36384d"/>
    <polygon points="87,40 97,55 90,60 82,48" fill="#232433"/>
    <polygon points="97,55 97,73 90,68 90,60" fill="#181923"/>
    <polygon points="97,73 87,88 82,80 90,68" fill="#14151e"/>
    <polygon points="87,88 73,97 71,88 82,80" fill="#232433"/>
    <polygon points="73,97 55,97 57,88 71,88" fill="#181923"/>
    <polygon points="55,97 41,88 46,80 57,88" fill="#232433"/>
    <polygon points="41,88 31,73 38,68 46,80" fill="#3d4057"/>
    <polygon points="31,73 31,55 38,60 38,68" fill="#36384d"/>
    <polygon points="31,55 41,40 46,48 38,60" fill="#464964"/>
    <polygon points="41,40 55,31 57,40 46,48" fill="#464964"/>

    <!-- Crisp 100% Pure White Facet Wireframe Lines -->
    <g stroke="#ffffff" stroke-width="1.25" stroke-opacity="1.0" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Outer Perimeter -->
      <polygon points="53,23 75,23 93,33 105,51 105,77 93,95 75,105 53,105 35,95 23,77 23,51 35,33"/>

      <!-- Middle Ring -->
      <polygon points="55,31 73,31 87,40 97,55 97,73 87,88 73,97 55,97 41,88 31,73 31,55 41,40" stroke-width="1.1"/>

      <!-- Inner Ring -->
      <polygon points="57,40 71,40 82,48 90,60 90,68 82,80 71,88 57,88 46,80 38,68 38,60 46,48" stroke-width="1.2"/>

      <!-- Radial Cut Lines: Outer to Middle -->
      <line x1="53" y1="23" x2="55" y2="31"/>
      <line x1="75" y1="23" x2="73" y2="31"/>
      <line x1="93" y1="33" x2="87" y2="40"/>
      <line x1="105" y1="51" x2="97" y2="55"/>
      <line x1="105" y1="77" x2="97" y2="73"/>
      <line x1="93" y1="95" x2="87" y2="88"/>
      <line x1="75" y1="105" x2="73" y2="97"/>
      <line x1="53" y1="105" x2="55" y2="97"/>
      <line x1="35" y1="95" x2="41" y2="88"/>
      <line x1="23" y1="77" x2="31" y2="73"/>
      <line x1="23" y1="51" x2="31" y2="55"/>
      <line x1="35" y1="33" x2="41" y2="40"/>

      <!-- Radial Cut Lines: Middle to Inner -->
      <line x1="55" y1="31" x2="57" y2="40"/>
      <line x1="73" y1="31" x2="71" y2="40"/>
      <line x1="87" y1="40" x2="82" y2="48"/>
      <line x1="97" y1="55" x2="90" y2="60"/>
      <line x1="97" y1="73" x2="90" y2="68"/>
      <line x1="87" y1="88" x2="82" y2="80"/>
      <line x1="73" y1="97" x2="71" y2="88"/>
      <line x1="55" y1="97" x2="57" y2="88"/>
      <line x1="41" y1="88" x2="46" y2="80"/>
      <line x1="31" y1="73" x2="38" y2="68"/>
      <line x1="31" y1="55" x2="38" y2="60"/>
      <line x1="41" y1="40" x2="46" y2="48"/>
    </g>
  </g>

  <!-- Central Recessed Abyss Core -->
  <circle cx="64" cy="64" r="22" fill="url(#inner-void)"/>
  <circle cx="64" cy="64" r="22" fill="url(#core-glow)"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-opacity="0.95"/>

  <!-- Glowing Terminal Neon Prompt (> _) -->
  <g filter="url(#neon-glow)">
    <!-- Cyan-Violet Glow Layer -->
    <path d="M 48 50 L 63 64 L 48 78" fill="none" stroke="url(#prompt-glow-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <line x1="70" y1="78" x2="82" y2="78" stroke="url(#prompt-glow-grad)" stroke-width="6.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Sharp Bright Foreground Layer -->
    <path d="M 48 50 L 63 64 L 48 78" fill="none" stroke="url(#prompt-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="78" x2="82" y2="78" stroke="url(#prompt-grad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Specular White Core Highlight -->
    <path d="M 48 50 L 63 64 L 48 78" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <line x1="70" y1="78" x2="82" y2="78" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Top Glass Highlight Rim on Squircle -->
  <path d="M 36 11.5 Q 64 12 92 11.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>
</svg>
