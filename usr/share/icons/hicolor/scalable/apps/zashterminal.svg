<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Drop Shadow Filters -->
    <filter id="squircle-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="gem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Base Squircle Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262837"/>
      <stop offset="40%" stop-color="#191a24"/>
      <stop offset="100%" stop-color="#0f0f15"/>
    </linearGradient>

    <linearGradient id="bg-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e5169" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2a2c3d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14141d" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Onyx Gem Facet Gradients -->
    <linearGradient id="facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4d68"/>
      <stop offset="100%" stop-color="#212230"/>
    </linearGradient>

    <linearGradient id="facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3d54"/>
      <stop offset="100%" stop-color="#1e1f2b"/>
    </linearGradient>

    <linearGradient id="facet-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252636"/>
      <stop offset="100%" stop-color="#14151e"/>
    </linearGradient>

    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>

    <linearGradient id="facet-shine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e202d"/>
      <stop offset="50%" stop-color="#41445d"/>
      <stop offset="100%" stop-color="#282a3c"/>
    </linearGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="inner-void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#13141d"/>
      <stop offset="75%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#060609"/>
    </radialGradient>

    <!-- Neon Prompt Gradients -->
    <linearGradient id="prompt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="prompt-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <g filter="url(#squircle-shadow)">
    <rect x="10" y="10" width="108" height="108" rx="26" ry="26" fill="url(#bg-grad)"/>
    <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" ry="25.5" fill="none" stroke="url(#bg-border)" stroke-width="1.2"/>
  </g>

  <!-- Gem Outer Rim / Shadow -->
  <g filter="url(#gem-shadow)">
    <!-- 12-sided Faceted Onyx Gem Ring -->
    <!-- Outer Octagon/Dodecagon coordinates centered at (64,64) R_out=42, R_mid=34, R_in=25 -->
    
    <!-- Outer Facets Layer -->
    <!-- Top -->
    <polygon points="53,23 75,23 73,31 55,31" fill="url(#facet-top)"/>
    <!-- Top Right 1 -->
    <polygon points="75,23 93,33 87,40 73,31" fill="url(#facet-light)"/>
    <!-- Top Right 2 -->
    <polygon points="93,33 105,51 97,55 87,40" fill="url(#facet-mid)"/>
    <!-- Right -->
    <polygon points="105,51 105,77 97,73 97,55" fill="url(#facet-dark)"/>
    <!-- Bottom Right 1 -->
    <polygon points="105,77 93,95 87,88 97,73" fill="url(#facet-dark)"/>
    <!-- Bottom Right 2 -->
    <polygon points="93,95 75,105 73,97 87,88" fill="url(#facet-mid)"/>
    <!-- Bottom -->
    <polygon points="75,105 53,105 55,97 73,97" fill="url(#facet-dark)"/>
    <!-- Bottom Left 1 -->
    <polygon points="53,105 35,95 41,88 55,97" fill="url(#facet-mid)"/>
    <!-- Bottom Left 2 -->
    <polygon points="35,95 23,77 31,73 41,88" fill="url(#facet-shine)"/>
    <!-- Left -->
    <polygon points="23,77 23,51 31,55 31,73" fill="url(#facet-light)"/>
    <!-- Top Left 1 -->
    <polygon points="23,51 35,33 41,40 31,55" fill="url(#facet-top)"/>
    <!-- Top Left 2 -->
    <polygon points="35,33 53,23 55,31 41,40" fill="url(#facet-top)"/>

    <!-- Inner Crown Facets Layer -->
    <polygon points="55,31 73,31 71,40 57,40" fill="url(#facet-shine)"/>
    <polygon points="73,31 87,40 82,48 71,40" fill="url(#facet-light)"/>
    <polygon points="87,40 97,55 90,60 82,48" fill="url(#facet-mid)"/>
    <polygon points="97,55 97,73 90,68 90,60" fill="url(#facet-dark)"/>
    <polygon points="97,73 87,88 82,80 90,68" fill="url(#facet-dark)"/>
    <polygon points="87,88 73,97 71,88 82,80" fill="url(#facet-mid)"/>
    <polygon points="73,97 55,97 57,88 71,88" fill="url(#facet-dark)"/>
    <polygon points="55,97 41,88 46,80 57,88" fill="url(#facet-mid)"/>
    <polygon points="41,88 31,73 38,68 46,80" fill="url(#facet-shine)"/>
    <polygon points="31,73 31,55 38,60 38,68" fill="url(#facet-light)"/>
    <polygon points="31,55 41,40 46,48 38,60" fill="url(#facet-top)"/>
    <polygon points="41,40 55,31 57,40 46,48" fill="url(#facet-top)"/>

    <!-- Inner Core Bevel Wall (Inwards depth) -->
    <polygon points="57,40 71,40 69,45 59,45" fill="#141520"/>
    <polygon points="71,40 82,48 77,51 69,45" fill="#10111a"/>
    <polygon points="82,48 90,60 83,62 77,51" fill="#0c0d14"/>
    <polygon points="90,60 90,68 83,66 83,62" fill="#08090e"/>
    <polygon points="90,68 82,80 77,77 83,66" fill="#0a0b10"/>
    <polygon points="82,80 71,88 69,83 77,77" fill="#12131b"/>
    <polygon points="71,88 57,88 59,83 69,83" fill="#161722"/>
    <polygon points="57,88 46,80 51,77 59,83" fill="#1a1b28"/>
    <polygon points="46,80 38,68 45,66 51,77" fill="#222434"/>
    <polygon points="38,68 38,60 45,62 45,66" fill="#26293a"/>
    <polygon points="38,60 46,48 51,51 45,62" fill="#2c2f44"/>
    <polygon points="46,48 57,40 59,45 51,51" fill="#25273b"/>

    <!-- Gem Facet Edge Lines (Crystal Sparkle & Sharpness) -->
    <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.6" fill="none">
      <line x1="53" y1="23" x2="75" y2="23"/>
      <line x1="75" y1="23" x2="93" y2="33"/>
      <line x1="93" y1="33" x2="105" y2="51"/>
      <line x1="105" y1="51" x2="105" y2="77"/>
      <line x1="105" y1="77" x2="93" y2="95"/>
      <line x1="93" y1="95" x2="75" y2="105"/>
      <line x1="75" y1="105" x2="53" y2="105"/>
      <line x1="53" y1="105" x2="35" y2="95"/>
      <line x1="35" y1="95" x2="23" y2="77"/>
      <line x1="23" y1="77" x2="23" y2="51"/>
      <line x1="23" y1="51" x2="35" y2="33"/>
      <line x1="35" y1="33" x2="53" y2="23"/>

      <line x1="55" y1="31" x2="73" y2="31"/>
      <line x1="73" y1="31" x2="87" y2="40"/>
      <line x1="87" y1="40" x2="97" y2="55"/>
      <line x1="97" y1="55" x2="97" y2="73"/>
      <line x1="97" y1="73" x2="87" y2="88"/>
      <line x1="87" y1="88" x2="73" y2="97"/>
      <line x1="73" y1="97" x2="55" y2="97"/>
      <line x1="55" y1="97" x2="41" y2="88"/>
      <line x1="41" y1="88" x2="31" y2="73"/>
      <line x1="31" y1="73" x2="31" y2="55"/>
      <line x1="31" y1="55" x2="41" y2="40"/>
      <line x1="41" y1="40" x2="55" y2="31"/>

      <!-- Radials -->
      <line x1="53" y1="23" x2="55" y2="31"/>
      <line x1="75" y1="23" x2="73" y2="31"/>
      <line x1="93" y1="33" x2="87" y2="40"/>
      <line x1="105" y1="51" x2="97" y2="55"/>
      <line x1="105" y1="77" x2="97" y2="73"/>
      <line x1="93" y1="95" x2="87" y2="88"/>
      <line x1="75" y1="105" x2="73" y2="97"/>
      <line x1="53" y1="105" x2="55" y2="97"/>
      <line x1="35" y1="95" x2="41" y2="88"/>
      <line x1="23" y1="77" x2="31" y2="73"/>
      <line x1="23" y1="51" x2="31" y2="55"/>
      <line x1="35" y1="33" x2="41" y2="40"/>
    </g>
  </g>

  <!-- Central Recessed Abyss Core -->
  <circle cx="64" cy="64" r="21" fill="url(#inner-void)"/>
  <circle cx="64" cy="64" r="21" fill="url(#core-glow)"/>
  <circle cx="64" cy="64" r="21" fill="none" stroke="#222538" stroke-width="1.2"/>

  <!-- Glowing Terminal Neon Prompt (> _) -->
  <g filter="url(#neon-glow)">
    <!-- Cyan-Violet Glow Layer -->
    <path d="M 48 50 L 63 64 L 48 78" fill="none" stroke="url(#prompt-glow-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <line x1="70" y1="78" x2="82" y2="78" stroke="url(#prompt-glow-grad)" stroke-width="6.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Sharp Bright Foreground Layer -->
    <path d="M 48 50 L 63 64 L 48 78" fill="none" stroke="url(#prompt-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="78" x2="82" y2="78" stroke="url(#prompt-grad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Specular White Core Highlight -->
    <path d="M 48 50 L 63 64 L 48 78" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <line x1="70" y1="78" x2="82" y2="78" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Top Glass Highlight Rim on Squircle -->
  <path d="M 36 11.5 Q 64 12 92 11.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" stroke-linecap="round"/>
</svg>
