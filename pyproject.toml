[project]
name = "zashterminal"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
version = "0.8.24"
authors = [
    { name = "Leonardo Berbert", email = "leo4berbert@gmail.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["PyGObject", "pycairo", "setproctitle", "requests", "psutil", "pycryptodomex", "regex; extra == 'performance'", "Pygments; extra == 'syntax-highlighting'", "py7zr; extra == 'backup'"]

[project.gui-scripts]
zashterminal = "zashterminal:main"

[project.urls]
Homepage = "https://github.com/VaGNaroK/zashterminal-Fork"
Issues = "https://github.com/VaGNaroK/zashterminal-Fork/issues"

[project.optional-dependencies]
performance = ["regex"]
syntax-highlighting = ["Pygments"]
backup = ["py7zr"]
dev = ["pytest", "pytest-asyncio"]
all = ["regex", "Pygments", "py7zr", "pytest", "pytest-asyncio"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
include = ["zashterminal"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
zashterminal = ["**/*"]

[tool.setuptools.data-files]
"share/applications" = ["usr/share/applications/org.leoberbert.zashterminal.desktop"]
"share/icons/hicolor/scalable/apps" = ["usr/share/icons/hicolor/scalable/apps/zashterminal.svg"]
"share/pixmaps" = ["usr/share/icons/hicolor/scalable/apps/zashterminal.svg"]
"share/kio/servicemenus" = ["usr/share/kio/servicemenus/zashterminal.desktop", "usr/share/kio/servicemenus/zashterminal-remote.desktop"]
"share/nautilus-python/extensions" = ["usr/share/nautilus-python/extensions/zashterminal.py"]
"share/nemo/actions" = ["usr/share/nemo/actions/zashterminal.nemo_action", "usr/share/nemo/actions/zashterminal-remote.nemo_action"]
"share/polkit-1/actions" = ["usr/share/polkit-1/actions/org.leoberbert.zashterminal.policy"]
