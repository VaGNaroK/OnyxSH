app-id: io.github.vagnarok.OnyxSH
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: onyxsh

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --filesystem=home
  - --talk-name=org.freedesktop.Secret
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.IBus
  - --talk-name=org.freedesktop.portal.Fcitx


modules:
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk4=true
      - -Dgtk3=false
      - -Ddocs=false
      - -Dgir=true
      - -Dvapi=false
      - -D_systemd=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.76/vte-0.76.0.tar.xz
        sha256: bbce30b8f504370b12d6439c07a82993e97d7e9afe2dd367817cd58ff029ffda

  - name: python3-dependencies
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app requests psutil regex pygments pycryptodomex setproctitle

  - name: host-spawn
    buildsystem: simple
    build-commands:
      - install -Dm755 host-spawn /app/bin/host-spawn
    sources:
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        dest-filename: host-spawn

  - name: onyxsh
    buildsystem: simple

    build-commands:
      - mkdir -p /app/lib/onyxsh /app/bin /app/share/applications /app/share/icons/hicolor/scalable/apps /app/share/icons/hicolor/scalable/actions /app/share/pixmaps /app/share/locale
      - cp -r src/onyxsh/* /app/lib/onyxsh/
      - cp src/onyxsh/icons/*.svg /app/share/icons/hicolor/scalable/actions/
      - cp usr/bin/onyxsh /app/bin/onyxsh
      - chmod +x /app/bin/onyxsh
      - cp usr/share/applications/io.github.vagnarok.OnyxSH.desktop /app/share/applications/
      - sed -i 's/^Icon=.*/Icon=io.github.vagnarok.OnyxSH/' /app/share/applications/io.github.vagnarok.OnyxSH.desktop
      - cp usr/share/icons/hicolor/scalable/apps/onyxsh.svg /app/share/icons/hicolor/scalable/apps/io.github.vagnarok.OnyxSH.svg
      - cp usr/share/icons/hicolor/scalable/apps/onyxsh.svg /app/share/icons/hicolor/scalable/apps/onyxsh.svg
      - cp usr/share/icons/hicolor/scalable/apps/onyxsh.svg /app/share/pixmaps/onyxsh.svg
      - |
        for po_file in locale/*.po; do
          if [ -f "$po_file" ]; then
            lang="$(basename "$po_file" .po)"
            mkdir -p "/app/share/locale/${lang}/LC_MESSAGES" "/app/lib/onyxsh/locale/${lang}/LC_MESSAGES"
            msgfmt "$po_file" -o "/app/share/locale/${lang}/LC_MESSAGES/onyxsh.mo" 2>/dev/null || true
            msgfmt "$po_file" -o "/app/lib/onyxsh/locale/${lang}/LC_MESSAGES/onyxsh.mo" 2>/dev/null || true
            if [ "$lang" = "pt" ]; then
              mkdir -p "/app/share/locale/pt_BR/LC_MESSAGES" "/app/lib/onyxsh/locale/pt_BR/LC_MESSAGES"
              msgfmt "$po_file" -o "/app/share/locale/pt_BR/LC_MESSAGES/onyxsh.mo" 2>/dev/null || true
              msgfmt "$po_file" -o "/app/lib/onyxsh/locale/pt_BR/LC_MESSAGES/onyxsh.mo" 2>/dev/null || true
            fi
          fi
        done
    sources:
      - type: dir
        path: ..
