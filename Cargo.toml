[workspace]
resolver = "2"
members = [
    "crates/onyxsh-core",
    "crates/onyxsh-terminal",
    "crates/onyxsh-filemanager",
    "crates/onyxsh-agent",
    "crates/onyxsh-system",
    "crates/onyxsh-admin-helper",
    "crates/onyxsh-app",
]

[workspace.package]
version = "0.14.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["VaGNaroK <indialuz42@gmail.com>"]
repository = "https://github.com/VaGNaroK/OnyxSH"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
base64 = "0.22"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
shlex = "1.3"
sha2 = "0.10"
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
vte4 = { version = "0.8", features = ["v0_76"] }

onyxsh-core = { path = "crates/onyxsh-core" }
onyxsh-terminal = { path = "crates/onyxsh-terminal" }
onyxsh-filemanager = { path = "crates/onyxsh-filemanager" }
onyxsh-agent = { path = "crates/onyxsh-agent" }
onyxsh-system = { path = "crates/onyxsh-system" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
