name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies for GTK4 & PyGObject
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgirepository1.0-dev \
          libcairo2-dev \
          pkg-config \
          python3-dev \
          gir1.2-gtk-4.0 \
          gir1.2-adw-1 \
          xvfb

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyGObject pycairo requests pyyaml setproctitle psutil pycryptodomex pytest pytest-asyncio

    - name: Run Test Suite
      run: |
        xvfb-run -a env PYTHONPATH=src pytest -v tests/
